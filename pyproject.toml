[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doubaowork2api"
version = "1.0.2"
description = "Direct, account-pooled OpenAI-compatible gateway for DoubaoWork"
authors = [{name = "niyouqianma"}]
readme = "README.md"
license-files = ["licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx[http2]>=0.28",
  "pydantic>=2.10",
  "uvicorn[standard]>=0.34",
  "cryptography>=45",
  "jsonschema>=4.23",
  "qrcode>=8",
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
doubaowork2api = "doubao_work2api.__main__:main"

[project.urls]
Homepage = "https://github.com/niyouqianma/doubaowork2api"
Repository = "https://github.com/niyouqianma/doubaowork2api"
Issues = "https://github.com/niyouqianma/doubaowork2api/issues"

[tool.setuptools.packages.find]
include = ["doubao_work2api*"]

[tool.setuptools.package-data]
doubao_work2api = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
